<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Bookmark-Manager/assets/bookmark-D3NswD0C.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark-Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Raleway:wght@100..900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/Bookmark-Manager/index.js"></script>
    <link rel="modulepreload" crossorigin href="/Bookmark-Manager/assets/vendor-I1I71QQ2.js">
    <link rel="stylesheet" crossorigin href="/Bookmark-Manager/assets/vendor-DnveWo0P.css">
    <link rel="stylesheet" crossorigin href="/Bookmark-Manager/assets/index-DcmV21Iu.css">
  </head>
  <body>
    <main class="content container">
      <div class="cloud-container">
        <div class="form-wrapper">
          <h1 class="form-title">Save your useful links</h1>
          <form class="form">
            <div class="input-wrapper">
              <label class="label" for="title">Link name</label>
              <input
                class="form-input"
                type="text"
                name="title"
                id="title"
                placeholder="Please enter title"
                required
              />
            </div>
            <div class="input-wrapper">
              <label for="url" class="label">Url address</label>
              <input
                class="form-input"
                type="url"
                name="url"
                id="url"
                placeholder="URL"
                required
              />
            </div>

            <button class="btn-submit" type="submit">Add</button>
          </form>
        </div>
      </div>
      <ul class="bookmark-list"></ul>
    </main>
  </body>
</html>
