<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/bookmark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark-Manager</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Raleway:wght@100..900&family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header container">
      <div class="cloud-container">
        <div class="form-wrapper">
          <h1 class="form-title">Save your useful links</h1>
          <form class="form">
            <div class="input-wrapper">
              <label for="title">Link name</label>
              <input
                type="text"
                name="title"
                id="title"
                placeholder="Please enter title"
                required
              />
            </div>
            <div class="input-wrapper">
              <label for="url">Url address</label>
              <input
                type="url"
                name="url"
                id="url"
                placeholder="URL"
                required
              />
            </div>

            <button class="btn-submit" type="submit">Add</button>
          </form>
        </div>
      </div>
      <ul class="bookmark-list"></ul>
    </header>
    <script type="module" src="./main.js"></script>
  </body>
</html>
